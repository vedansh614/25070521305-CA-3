<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCricket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="100%" stop-color="#0a233a"/>
    </linearGradient>
    <radialGradient id="turfGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07111e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCricket)"/>
  <rect x="100" y="50" width="600" height="400" rx="24" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-width="2"/>
  <circle cx="400" cy="250" r="180" fill="url(#turfGlow)"/>
  <!-- Pitch Rectangle -->
  <rect x="330" y="90" width="140" height="320" rx="8" fill="#134e4a" stroke="#34d399" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Popping and Bowling Creases -->
  <line x1="310" y1="140" x2="490" y2="140" stroke="#f8fafc" stroke-width="3"/>
  <line x1="310" y1="360" x2="490" y2="360" stroke="#f8fafc" stroke-width="3"/>
  <!-- Stumps top and bottom -->
  <circle cx="380" cy="130" r="4" fill="#a3e635"/>
  <circle cx="400" cy="130" r="4" fill="#a3e635"/>
  <circle cx="420" cy="130" r="4" fill="#a3e635"/>
  <circle cx="380" cy="370" r="4" fill="#a3e635"/>
  <circle cx="400" cy="370" r="4" fill="#a3e635"/>
  <circle cx="420" cy="370" r="4" fill="#a3e635"/>
  <!-- Label Badge -->
  <rect x="290" y="225" width="220" height="50" rx="25" fill="#0a192f" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="256" font-family="sans-serif" font-size="16" font-weight="800" fill="#a3e635" text-anchor="middle" letter-spacing="2">BOX CRICKET TURF</text>
</svg>
