<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBasketball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#2a1b0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgBasketball)"/>
  <!-- Court Surface -->
  <rect x="80" y="50" width="640" height="400" rx="12" fill="#7c2d12" fill-opacity="0.45" stroke="#f97316" stroke-width="2"/>
  <!-- Midcourt Line and Circle -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="400" cy="250" r="70" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <!-- Left Key and 3pt Line -->
  <rect x="80" y="180" width="140" height="140" fill="#c2410c" fill-opacity="0.3" stroke="#f8fafc" stroke-width="2"/>
  <path d="M80,90 A180,180 0 0,1 80,410" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <!-- Left Hoop -->
  <line x1="100" y1="210" x2="100" y2="290" stroke="#f8fafc" stroke-width="4"/>
  <circle cx="115" cy="250" r="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <!-- Right Key and 3pt Line -->
  <rect x="580" y="180" width="140" height="140" fill="#c2410c" fill-opacity="0.3" stroke="#f8fafc" stroke-width="2"/>
  <path d="M720,90 A180,180 0 0,0 720,410" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <!-- Right Hoop -->
  <line x1="700" y1="210" x2="700" y2="290" stroke="#f8fafc" stroke-width="4"/>
  <circle cx="685" cy="250" r="14" fill="none" stroke="#f97316" stroke-width="3"/>
  <!-- Badge -->
  <rect x="280" y="225" width="240" height="50" rx="25" fill="#0a192f" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="256" font-family="sans-serif" font-size="16" font-weight="800" fill="#fb923c" text-anchor="middle" letter-spacing="2">BASKETBALL COURT</text>
</svg>
