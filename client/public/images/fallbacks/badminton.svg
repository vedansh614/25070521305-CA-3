<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBadminton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f2d"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgBadminton)"/>
  <!-- Court Mat Area -->
  <rect x="120" y="70" width="560" height="360" rx="8" fill="#042f2e" fill-opacity="0.6" stroke="#06b6d4" stroke-width="3"/>
  <!-- Net Line -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#f8fafc" stroke-width="4"/>
  <!-- Short Service Lines -->
  <line x1="320" y1="70" x2="320" y2="430" stroke="#f8fafc" stroke-width="2"/>
  <line x1="480" y1="70" x2="480" y2="430" stroke="#f8fafc" stroke-width="2"/>
  <!-- Center Line (splitting service courts) -->
  <line x1="120" y1="250" x2="320" y2="250" stroke="#f8fafc" stroke-width="2"/>
  <line x1="480" y1="250" x2="680" y2="250" stroke="#f8fafc" stroke-width="2"/>
  <!-- Doubles Sidelines -->
  <line x1="120" y1="100" x2="680" y2="100" stroke="#f8fafc" stroke-width="2"/>
  <line x1="120" y1="400" x2="680" y2="400" stroke="#f8fafc" stroke-width="2"/>
  <!-- Shuttlecock icon -->
  <g transform="translate(400, 250) scale(0.8)">
    <circle cx="0" cy="0" r="14" fill="#a3e635"/>
    <path d="M-10,-5 L-40,-30 L0,-25 L40,-30 L10,-5 Z" fill="#f8fafc" fill-opacity="0.8"/>
  </g>
  <!-- Badge -->
  <rect x="280" y="225" width="240" height="50" rx="25" fill="#0a192f" stroke="#06b6d4" stroke-width="2"/>
  <text x="400" y="256" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">BADMINTON COURT</text>
</svg>
